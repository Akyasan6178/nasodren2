<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sinüs Harekâtı — Nasodren</title>
<style>
  :root{
    --ink:#060d14;
    --abyss:#0a1620;
    --oxygen:#35e0d8;
    --oxygen-deep:#0e6f70;
    --cyclamen:#ff4d9d;
    --cyclamen-deep:#8e2358;
    --ember:#ff6b3d;
    --inflame:#ff5a72;
    --bone:#eef7f9;
    --muted:#9cc0cf;
    --label:#bdd9e4;
    --cut:14px;
    /* GOAL-021: daraltılmış (condensed) yazı tipi bırakıldı. Dar harfler küçük
       punto + geniş harf aralığıyla birleşinca, özellikle Türkçe aksanlı harflerde
       (İ, Ş, Ğ, Ç) okumayı zorlaştırıyordu. Yerine her platformda hazır bulunan,
       geniş ve net bir arayüz ailesi geliyor — indirilen font yok, açılış gecikmesi
       ve çevrimdışı sorunu da yok. */
    --face:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Noto Sans",
      "Helvetica Neue",Arial,sans-serif;
    /* HUD geniş ekranda kenarlara yapışmasın: oyun alanı gibi ortalanıp sınırlanıyor */
    --hudw:1120px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--ink);touch-action:none;overscroll-behavior:none;
    font-family:var(--face);color:var(--bone);-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{position:absolute;inset:0;display:block}
  #vig{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(135% 110% at 50% 46%,rgba(0,0,0,0) 46%,rgba(3,8,12,.78) 100%)}
  /* ---------- GOAL-015: basinc perdesi ----------
     Tikanik nefes ekrani "kizartir". Bilerek dusuk tavanli ve merkezde neredeyse
     seffaf: uzun oturumda goz yormasin diye kirmizi kenarlardan iceri dogru
     sizar, ortadaki oynanabilir alan okunakli kalir. Nabiz atisi JS'ten geliyor. */
  #pressVeil{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;
    mix-blend-mode:screen;
    background:radial-gradient(118% 100% at 50% 50%,
      rgba(150,14,36,.05) 0%,rgba(158,16,40,.22) 56%,rgba(104,6,24,.54) 100%)}
  /* ---------- GOAL-027: akis perdesi ----------
     Basinc perdesinin turkuaz karsiti. Hava yolu artik bir kapi degil bir
     degisken; acildikca butun saha oksijenleniyor. Ayni geometri kullanildi
     (kenarlardan iceri sizan bir isik) ki iki perde birbirinin yerine gecerken
     ekran sicramasin: tikaliyken kirmizi, acikken turkuaz. */
  #flowVeil{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;
    mix-blend-mode:screen;
    background:radial-gradient(118% 100% at 50% 50%,
      rgba(40,220,210,.04) 0%,rgba(46,206,200,.16) 58%,rgba(24,150,150,.40) 100%)}
  /* ---------- HUD (GOAL-021) ----------
     Arayüzün tamamı tek bir hizaya oturtuldu. Üç kural:
       1) HUD artık ekran kenarlarına yapışmıyor; oyun alanı gibi ortalanıp
          --hudw ile sınırlanıyor. Geniş ekranda "GÜN" sol uçta, "SKOR" sağ uçta
          kalıp aradaki her şey dağılmıyor.
       2) Alt sıradaki her gösterge aynı bileşen (.meter): aynı yükseklikte etiket
          satırı, aynı kalınlıkta çubuk ve sağda MUTLAKA sayısal değer. Eskiden
          çubukların kalınlığı ve hizası farklıydı, doğru değerler hiç yazılmıyordu.
       3) Etiketler büyüdü, harf aralığı daraltıldı, kontrast artırıldı. */
  #hud{position:absolute;left:0;right:0;top:0;z-index:3;pointer-events:none;
    padding:calc(10px + env(safe-area-inset-top)) 16px 14px;
    background:linear-gradient(180deg,rgba(6,13,20,.95) 22%,rgba(6,13,20,.72) 74%,rgba(6,13,20,0))}
  /* GOAL-023: HUD'un eni tahtanın eniyle eşitleniyor (bkz. layout). Sabit
     1120px iken, 613px genişliğindeki bir tahtanın üstünde 1120px'lik bir
     gösterge şeridi duruyordu: doz çubuğu 319px, ana çubuk 942px uzunluğunda,
     aralarında bomboş alan. Artık HUD ile tahta tek bir blok gibi hizalı. */
  .hudInner{position:relative;width:100%;max-width:var(--hudw);margin:0 auto}
  .row{display:flex;align-items:flex-end;gap:18px}
  .lbl{font-size:12px;letter-spacing:.05em;color:var(--label);line-height:1;font-weight:700}
  .num{font-size:28px;line-height:.9;font-weight:800;font-variant-numeric:tabular-nums}
  #day{flex:none;min-width:54px}
  #day .lbl{margin-bottom:7px}
  #day .num{color:var(--oxygen);text-shadow:0 0 18px rgba(53,224,216,.5);font-size:38px}
  #scoreBox{flex:none;margin-left:auto;text-align:right;min-width:88px}
  #scoreBox .lbl{margin-bottom:7px}
  #scoreBox .num{color:var(--bone)}
  #stage{flex:1;min-width:0}
  /* GOAL-024: bolge adi + taraf, arkasindan (genis ekranda) gunun temasi */
  #stageName b{font-weight:700}
  #stageName i{font-style:normal;font-weight:700;color:var(--oxygen);margin-left:7px}
  #stageName u{text-decoration:none;font-weight:500;color:var(--muted);margin-left:12px;font-size:15px}
  #stageName{font-size:18px;font-weight:700;color:var(--bone);letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:9px}

  /* Ana ilerleme çubuğu artık saç teli değil: 12px, çerçeveli, hedef işaretli */
  .gauge{position:relative;height:12px;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14)}
  .gauge>span{position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,var(--oxygen-deep),var(--oxygen));
    box-shadow:0 0 14px rgba(53,224,216,.65);transition:width .22s cubic-bezier(.2,.8,.3,1)}
  .gauge>i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bone);opacity:.9;
    box-shadow:0 0 8px rgba(238,247,249,.85)}
  #pctRead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;
    font-size:14px;color:var(--label);font-variant-numeric:tabular-nums}
  #pctRead b{color:var(--oxygen);font-weight:800;font-size:19px;line-height:1;
    text-shadow:0 0 12px rgba(53,224,216,.45)}
  #pctRead .tag{font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--label);
    padding:4px 9px 3px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
  #pctRead .tag.warn{color:#ffb1c9;border-color:rgba(255,77,157,.45);background:rgba(255,77,157,.12)}
  #pctRead.met b{color:#9df58a;text-shadow:0 0 12px rgba(157,245,138,.55)}
  #pctRead.met .tag{color:#9df58a;border-color:rgba(157,245,138,.45);background:rgba(157,245,138,.1)}

  /* ---------- gösterge modülleri ---------- */
  #sub{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:18px;
    align-items:start;margin-top:15px}
  .meter{min-width:0}
  .mHead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    height:13px;margin-bottom:8px}
  .mHead .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mHead b{font-size:14.5px;font-weight:800;line-height:1;color:var(--bone);
    font-variant-numeric:tabular-nums;flex:none}
  /* GOAL-027: akisin o anki kazanci — oyuncu hava yolunu neden istedigini
     rakamla gorsun diye gostergenin yaninda duruyor. */
  #airPct i{font-style:normal;font-size:12px;font-weight:800;margin-left:6px;
    color:var(--oxygen);text-shadow:0 0 10px rgba(53,224,216,.5)}
  #airway.open #airPct i{color:#9df58a;text-shadow:0 0 10px rgba(157,245,138,.55)}
  .bar{position:relative;height:9px;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.13)}
  .bar>span,.bar>u{position:absolute;left:0;top:0;bottom:0;display:block;width:0;
    text-decoration:none;transition:width .25s ease}

  #doseWrap .lbl,#doseWrap b{transition:color .2s}
  #doseFill{background:linear-gradient(90deg,#7a5a12,#ffc24a);box-shadow:0 0 12px rgba(255,194,74,.5)}
  #doseWrap.warn .lbl,#doseWrap.warn b{color:#ffb347}
  #doseWrap.warn .lbl{animation:doseWarnPulse 1.1s ease-in-out infinite}
  #doseWrap.critical .lbl,#doseWrap.critical b{color:#ff4d6d}
  #doseWrap.critical .lbl{animation:doseCritPulse .55s ease-in-out infinite}
  @keyframes doseWarnPulse{0%,100%{opacity:1}50%{opacity:.45}}
  @keyframes doseCritPulse{0%,100%{opacity:1}50%{opacity:.4}}

  #pressFill{background:linear-gradient(90deg,#5e1322,var(--inflame));
    box-shadow:0 0 12px rgba(255,90,114,.5)}
  #pressWrap.high .lbl,#pressWrap.high b{color:var(--inflame)}
  #pressWrap.high .lbl{animation:doseCritPulse .7s ease-in-out infinite}

  /* GOAL-017: havanın yolun neresinde takıldığını gösteren çubuk. Dolu kısım
     havanın gidebildiği mesafe, kırmızı imleç tam tıkanma noktası. */
  #airGauge{background:rgba(255,120,130,.16);border-color:rgba(255,120,130,.3)}
  #airFill{background:linear-gradient(90deg,var(--oxygen-deep),var(--oxygen));
    box-shadow:0 0 12px rgba(53,224,216,.55)}
  #airMark{position:absolute;top:-4px;bottom:-4px;left:0;width:3px;background:var(--inflame);
    box-shadow:0 0 9px rgba(255,90,114,.95);transition:left .3s ease;
    animation:doseWarnPulse .85s ease-in-out infinite}
  #airPct{color:#ff8a9c}
  #airway.partial #airPct{color:#ffc24a}
  #airway.open #airGauge{background:rgba(53,224,216,.18);border-color:rgba(53,224,216,.42)}
  #airway.open #airMark{display:none}
  #airway.open #airPct{color:var(--oxygen);text-shadow:0 0 14px rgba(53,224,216,.55)}
  /* nefes geri sayımı hava yolu modülünün altında: ikisi aynı hikayenin parçası */
  .mSub{display:flex;align-items:center;gap:9px;margin-top:9px}
  .mSub>span{font-size:11.5px;letter-spacing:.04em;color:var(--muted);font-weight:700;flex:none}
  .mSub .thin{flex:1;height:5px;min-width:0}
  .mSub>b{font-size:13px;font-weight:800;color:var(--label);flex:none;
    font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
  #breathBar{background:var(--oxygen);opacity:.75}
  #airway.soon #breathBar,#airway.soon .mSub>b{animation:breathCue .42s ease-in-out infinite}
  #airway.soon .mSub>b{color:var(--oxygen)}
  @keyframes breathCue{0%,100%{opacity:.35}50%{opacity:1}}

  /* Can: eskiden 16px’lik ikonlardı, oyun sırasında fark edilmiyordu */
  #lives{display:flex;gap:9px;align-items:center;height:30px}
  .heart{width:30px;height:30px;object-fit:contain;
    filter:drop-shadow(0 0 9px rgba(255,77,157,.6));transition:opacity .2s,filter .2s,transform .2s}
  .heart.off{opacity:.2;transform:scale(.84);filter:grayscale(1) brightness(.6)}

  /* Buff rozetleri akışın dışında: görünüp kayboldukça HUD yüksekliğini
     değiştirip oyun alanını zıplatmasınlar (bkz. layout(), hud.offsetHeight). */
  #buffs{position:absolute;top:100%;right:0;margin-top:10px;display:flex;gap:8px;
    flex-wrap:wrap;justify-content:flex-end;max-width:100%}
  .buff{font-size:12.5px;letter-spacing:.03em;font-weight:700;padding:6px 11px 5px;color:var(--oxygen);
    border:1px solid rgba(53,224,216,.45);background:rgba(8,20,26,.82);white-space:nowrap;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
  .buff.warn{color:#ffb1c9;border-color:rgba(255,77,157,.5);background:rgba(40,10,22,.85)}

  /* GOAL-023: 1366x768 gibi alçak ekranlarda 173px'lik HUD, yüksekliğin
     dörtte birini yiyordu; tahtanın ölçüsünü de o belirliyor. Dikey boşluklar
     kısıldı, bilgi düzeni aynı kaldı. */
  @media (min-width:681px) and (max-height:900px){
    #hud{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:10px}
    #day .num{font-size:34px}
    .num{font-size:25px}
    #stageName{font-size:17px;margin-bottom:7px}
    #pctRead{margin-top:7px}
    #sub{margin-top:11px}
    .mHead{margin-bottom:6px}
    #lives{height:26px}
    .heart{width:26px;height:26px}
  }
  @media (max-width:680px){
    #hud{padding:calc(8px + env(safe-area-inset-top)) 12px 12px}
    .row{gap:12px}
    #day{min-width:42px}
    #day .num{font-size:30px}
    #scoreBox{min-width:64px}
    .num{font-size:23px}
    #stageName{font-size:15px;margin-bottom:8px}
    #stageName u{display:none}
    .gauge{height:10px}
    #pctRead{font-size:13px;gap:8px;margin-top:8px}
    #pctRead b{font-size:16px}
    #pctRead .tag{font-size:12px;padding:3px 7px 2px}
    #sub{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 16px;margin-top:13px}
    #lives{height:26px;gap:7px}
    .heart{width:26px;height:26px}
    .buff{font-size:12px;padding:5px 9px 4px}
  }

  /* GOAL-022 (revize): dikey konum JS'ten (layout) geliyor — sabit %26,
     telefonda yazıyı HUD'un altına sokuyordu. Genişlik de sınırlandı ki
     uzun uyarılar dar ekranda taşmasın. */
  #toast{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;
    width:min(520px,92vw);text-align:center;opacity:0;transition:opacity .18s}
  #toast.on{opacity:1}
  #toast .t{font-size:32px;font-weight:800;letter-spacing:.02em;color:var(--cyclamen);
    text-shadow:0 0 28px rgba(255,77,157,.8),0 2px 0 rgba(0,0,0,.5)}
  #toast .s{font-size:13.5px;letter-spacing:.03em;color:var(--bone);opacity:.92;margin-top:8px}

  /* ---------- panolar ---------- */
  /* GOAL-022: duraklatma/brifing paneli telefonda ekrana sığmayıp alttan
     kesiliyordu. Kap artık kaydırılabilir; .plateEdge'deki margin:auto,
     flex ortalamanın taşan içeriği tepeden kırpma davranışını da gideriyor. */
  #overlay{position:absolute;inset:0;z-index:5;display:none;align-items:flex-start;justify-content:center;
    padding:22px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    background:linear-gradient(180deg,rgba(6,13,20,.9),rgba(4,9,13,.94))}
  #overlay.on{display:flex}
  #overlay .plateEdge{margin:auto}

  /* ---------- GOAL-026: ANA MENÜ ----------
     GOAL-014'te menü, oyunun üstüne binen küçük bir kart olmaktan çıkıp ayrı bir
     tam ekran olmuştu; ama o ekran düz bir gradyandı ve oyunla hiçbir akrabalığı
     yoktu. Menü artık oyunun kendi malzemesinden yapılıyor:

       1) Arkada canvas çalışmaya devam ediyor — gün 1'in burun kesiti, kemik
          duvarları, nefes alan port halkaları. Üstüne buzlu cam bir perde
          iniyor. Yani menüye ayrı bir arka plan görseli üretmiyoruz; arka plan
          oyunun kendisi.
       2) Amblem, oyuncunun sahada yönettiği siklamen sprite'ının ta kendisi:
          menüdeki çiçek ile oynadığın çiçek aynı. Marka da böylece tek satır
          yazı olmaktan çıkıp ekranın merkezine oturuyor.
       3) Nefes oyunun ana ritmi; amblemin arkasındaki ışık ve çiçeğin salınımı
          aynı tempoda (6.5 sn) soluk alıp veriyor.

     Perde saydam olduğu için HUD ve araç düğmeleri menü açıkken gizleniyor
     (body.menuOn) — yoksa göstergeler camın ardından sızıyordu. Gizleme
     opacity ile, display ile değil: layout() HUD yüksekliğini ölçüyor. */
  #menuScreen{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;
    align-items:center;justify-content:flex-start;padding:34px 20px;
    /* overflow-x: dekoratif ::before katmani negatif inset ile disari tasiyor;
       kirpilmazsa dar ekranda yatay kaydirma acilip icerigi saga kaydiriyor. */
    overflow-y:auto;overflow-x:hidden;
    background:
      radial-gradient(118% 78% at 50% -6%, rgba(53,224,216,.13), transparent 62%),
      radial-gradient(96% 62% at 50% 112%, rgba(255,77,157,.13), transparent 62%),
      radial-gradient(150% 120% at 50% 50%, transparent 22%, rgba(2,6,10,.70) 100%),
      linear-gradient(180deg,rgba(8,18,26,.56) 0%,rgba(5,11,17,.62) 46%,rgba(2,6,10,.76) 100%);
    -webkit-backdrop-filter:blur(16px) saturate(1.25);
    backdrop-filter:blur(16px) saturate(1.25)}
  #menuScreen.on{display:flex}
  /* İnce, yavaşça kayan hava telleri — sahadaki akış şeritlerinin sakin hâli.
     Maske ile kenarlara doğru sönüyor ki yazının arkasında desen kalmasın. */
  #menuScreen::before{content:'';position:absolute;inset:-14% -24%;pointer-events:none;
    background:repeating-linear-gradient(104deg,
      rgba(53,224,216,.05) 0 2px, transparent 2px 168px);
    -webkit-mask-image:radial-gradient(74% 62% at 50% 42%,#000,transparent 78%);
    mask-image:radial-gradient(74% 62% at 50% 42%,#000,transparent 78%);
    animation:menuDrift 24s linear infinite}
  @keyframes menuDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(168px,-44px,0)}}
  /* GOAL-024: harita ekrani uzun; flex ortalamanin tasan icerigi tepeden
     kirpma davranisini margin:auto ile gideriyoruz (bkz. #overlay). */
  #menuContent{position:relative;z-index:1;margin:auto;width:100%;
    display:flex;flex-direction:column;align-items:center}
  body.menuOn #hud,body.menuOn #tools,body.menuOn #touchHint{opacity:0;pointer-events:none}
  #hud,#tools{transition:opacity .28s ease}

  /* ---- marka kilidi ---- */
  .menuHero{position:relative;display:flex;flex-direction:column;align-items:center;
    text-align:center;margin:2px 0 22px}
  .heroBreath{position:absolute;left:50%;top:56px;width:440px;height:440px;
    margin:-220px 0 0 -220px;pointer-events:none;border-radius:50%;
    background:radial-gradient(circle,rgba(255,77,157,.20),rgba(53,224,216,.10) 44%,transparent 70%);
    animation:heroBreath 6.5s ease-in-out infinite}
  @keyframes heroBreath{0%,100%{transform:scale(.84);opacity:.5}46%{transform:scale(1.06);opacity:1}}
  .heroEmblem{position:relative;width:100px;height:100px;display:grid;place-items:center;
    margin-bottom:18px;
    background:linear-gradient(158deg,var(--oxygen) 0%,rgba(53,224,216,.5) 38%,var(--cyclamen) 100%);
    clip-path:polygon(0 18px,18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%);
    filter:drop-shadow(0 16px 34px rgba(0,0,0,.6))}
  .heroEmblem::after{content:'';position:absolute;inset:2px;
    background:linear-gradient(158deg,#102431,#050d14 60%,#0d1b26);
    clip-path:polygon(0 16px,16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
  /* Siklamen 85x89'luk bir pixel-art; büyütülürken bulanmasın diye pixelated. */
  .heroEmblem img{position:relative;z-index:1;width:70px;height:73px;
    image-rendering:pixelated;filter:drop-shadow(0 0 18px rgba(255,77,157,.65));
    animation:heroFloat 6.5s ease-in-out infinite}
  @keyframes heroFloat{0%,100%{transform:translateY(-3px) rotate(-2.2deg)}
                       46%{transform:translateY(3px) rotate(2.2deg)}}
  /* İki satır: tek satırda "SİNÜS HAREKÂTI" telefonda taşıyor, ayrıca
     istiflenmiş hâli daha çok bir oyun logosu gibi duruyor. Gradyan iki satırı
     birden kat ediyor — üst satır açık, alt satır koyu. */
  .wordmark{display:flex;flex-direction:column;align-items:center;
    font-size:clamp(33px,7.2vw,50px);line-height:1.16;font-weight:800;
    background:linear-gradient(180deg,#f4feff 0%,#cdf2f0 54%,#84dcdb 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 30px rgba(53,224,216,.30))}
  .wordmark span{display:block}
  /* Üst satır: daha küçük punto + geniş aralık. Alt satırın enine yaklaşıyor,
     böylece iki satır tek bir blok gibi okunuyor. Negatif sağ kenar, harf
     aralığının son harften sonra bıraktığı boşluğu geri alıp yazıyı gerçekten
     ortalıyor. */
  .wordmark .w1{font-size:.86em;letter-spacing:.50em;margin-right:-.50em}
  .wordmark .w2{letter-spacing:.045em;margin-right:-.045em}
  /* Harf aralığı son harfin sağında da boşluk bırakıyor; negatif sağ kenarla
     geri alınmazsa ortalanmış yazı sola kaçık görünüyor. */
  .heroSub{display:flex;justify-content:center;margin-top:11px}
  .heroSub span{font-size:12px;font-weight:700;letter-spacing:.19em;margin-right:-.19em;
    color:var(--cyclamen);text-shadow:0 0 20px rgba(255,77,157,.5)}
  .heroTag{margin-top:15px;font-size:clamp(16px,4.2vw,21px);font-weight:600;
    line-height:1.35;color:#c6e1e9}
  .heroTag em{font-style:normal;color:var(--cyclamen);text-shadow:0 0 28px rgba(255,77,157,.55)}
  .heroRule{margin-top:16px;width:min(400px,84vw);height:1px;
    background:linear-gradient(90deg,transparent,rgba(53,224,216,.55),transparent)}

  /* ---- menü düğmeleri ---- */
  .menuBrand{text-align:center;margin-bottom:40px}
  .menuStack{display:flex;flex-direction:column;gap:12px;width:min(400px,90vw)}
  .menuBtn{position:relative;overflow:hidden;
    padding:17px 24px 16px;font-size:15.5px;font-weight:700;letter-spacing:.09em;text-align:center;
    background:linear-gradient(100deg,rgba(11,25,34,.76),rgba(6,15,22,.64));
    border:1px solid rgba(53,224,216,.26);color:var(--bone);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
    transition:transform .14s ease,border-color .16s,background .16s,box-shadow .16s}
  /* Sol kenardaki ışıklı ray: seçili satırı bir kart değil bir "kanal" gibi
     okutuyor — oyunun kendi turkuaz kanal parıltısıyla aynı dil. */
  .menuBtn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--oxygen);opacity:.3;transition:opacity .16s,box-shadow .16s}
  .menuBtn:hover,.menuBtn:focus-visible{border-color:var(--oxygen);transform:translateY(-2px);
    background:linear-gradient(100deg,rgba(28,86,92,.86),rgba(9,28,36,.72));
    box-shadow:0 14px 32px -18px rgba(53,224,216,.9)}
  .menuBtn:hover::before,.menuBtn:focus-visible::before{opacity:1;box-shadow:0 0 14px rgba(53,224,216,.85)}
  .menuBtn:active{transform:translateY(0)}
  /* .nav: yalnızca ana menünün üç sütunlu satırı — simge | ad | künye.
     Diğer ekranlardaki düz metinli düğmeler eskisi gibi ortalı kalıyor. */
  .menuBtn.nav{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:14px;
    text-align:left;padding-left:22px}
  .mbGlyph{font-size:13px;line-height:1;text-align:center;color:var(--oxygen);opacity:.95}
  .mbLabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mbHint{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--muted);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .menuBtn.primary{background:linear-gradient(100deg,var(--oxygen) 0%,#5fe8dd 50%,#93f2e0 100%);
    color:#032023;border-color:transparent;font-size:17px;padding-top:20px;padding-bottom:19px}
  .menuBtn.primary::before{background:#032023;opacity:.3}
  .menuBtn.primary .mbGlyph{color:#032023;opacity:.75}
  .menuBtn.primary .mbHint{color:rgba(3,32,35,.6)}
  .menuBtn.primary:hover,.menuBtn.primary:focus-visible{border-color:transparent;
    background:linear-gradient(100deg,#48e5db 0%,#6ceee2 50%,#a2f5e4 100%);
    box-shadow:0 16px 40px -16px rgba(53,224,216,.95)}
  .menuBtn.primary:hover::before,.menuBtn.primary:focus-visible::before{opacity:.45;box-shadow:none}
  /* Birincil düğmenin üstünden geçen ışık — göz ilk oraya gitsin. */
  .menuBtn.primary::after{content:'';position:absolute;top:0;bottom:0;left:-46%;width:36%;
    pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
    animation:mbSheen 5s ease-in-out infinite}
  @keyframes mbSheen{0%,66%{left:-46%}100%{left:132%}}
  .menuBtn.ghost{background:none;border-color:rgba(255,255,255,.16);color:var(--label);
    font-size:14px;padding:15px 22px}
  .menuBtn.ghost::before{background:rgba(255,255,255,.4);opacity:.18}
  .menuBack{margin-top:26px}

  /* ---- alt künye şeridi ---- */
  .menuFoot{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
    margin-top:18px;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:#9dc2d1;
    text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .menuFoot b{color:var(--oxygen);font-weight:800;letter-spacing:.06em;
    font-variant-numeric:tabular-nums}
  .menuFoot i{font-style:normal;opacity:.35}
  .levelGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;
    width:min(680px,92vw);max-height:52vh;overflow-y:auto;padding:6px;margin-bottom:8px}
  .levelBtn{display:flex;flex-direction:column;gap:7px;padding:16px 15px;text-align:left;
    background:rgba(10,23,31,.74);border:1px solid rgba(53,224,216,.22);color:var(--bone);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
    transition:border-color .15s,background .15s}
  .levelBtn:hover{border-color:var(--oxygen);background:rgba(24,74,80,.82)}
  .levelDay{font-size:11.5px;letter-spacing:.06em;color:var(--oxygen);font-weight:700}
  .levelName{font-size:14.5px;font-weight:600;line-height:1.34}
  .plateEdge{width:min(520px,100%);background:linear-gradient(150deg,var(--oxygen),rgba(53,224,216,.25) 45%,rgba(255,77,157,.5));
    clip-path:polygon(0 var(--cut),var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%);
    filter:drop-shadow(0 22px 48px rgba(0,0,0,.65))}
  .plate{margin:1px;padding:30px 30px 26px;background:linear-gradient(165deg,#0d1a24,#081119 60%,#0b141d);
    clip-path:polygon(0 var(--cut),var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%)}
  .kicker{font-size:12px;letter-spacing:.1em;color:var(--oxygen);font-weight:700;margin-bottom:14px}
  .title{font-size:clamp(30px,7.5vw,50px);line-height:.92;font-weight:700;letter-spacing:.01em;margin-bottom:16px}
  .title em{font-style:normal;color:var(--cyclamen);text-shadow:0 0 30px rgba(255,77,157,.6)}
  .lede{font-size:15.5px;line-height:1.72;color:#c6dbe2;max-width:46ch;margin-bottom:18px}
  .rule{height:1px;margin:20px 0;background:linear-gradient(90deg,rgba(53,224,216,.7),rgba(53,224,216,0))}
  .note{font-size:14px;line-height:1.72;color:var(--muted);border-left:2px solid var(--cyclamen-deep);
    padding-left:14px;margin-bottom:20px;max-width:46ch}
  /* GOAL-019: bölüm girişinde günün bilgi görseli — oyuncu onu sahada açığa
     çıkarmayı beklemeden, adıyla birlikte görsün diye. */
  .plateShot{display:flex;align-items:center;gap:18px;margin:2px 0 20px;flex-wrap:wrap}
  .plateShot img{width:164px;height:132px;object-fit:contain;flex:none;
    border:1px solid rgba(53,224,216,.22);background:#050c12}
  .plateShot b{display:block;font-size:12.5px;letter-spacing:.06em;color:var(--oxygen);
    font-weight:700;margin-bottom:8px}
  .plateShot p{font-size:14.5px;line-height:1.66;color:#c6dbe2;max-width:32ch}
  .note b{color:var(--cyclamen);font-weight:600}
  .stats{display:flex;gap:30px;margin-bottom:22px;flex-wrap:wrap}
  .stats div span{display:block;font-size:11.5px;letter-spacing:.05em;color:var(--muted);margin-bottom:6px;font-weight:700}
  .stats div b{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px;color:#b0cbd4;margin-bottom:20px}
  .keys b{color:var(--oxygen);font-weight:700;letter-spacing:.05em;font-size:12px}
  .acts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .nameInput{font:inherit;padding:14px 16px;font-size:15px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--bone);background:rgba(255,255,255,.06);border:1px solid rgba(53,224,216,.35);
    outline:none;min-width:160px}
  .nameInput:focus{border-color:var(--oxygen)}
  .nameInput.errorShake{animation:inputShake .32s}
  @keyframes inputShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .hsList{margin-bottom:20px;max-height:260px;overflow-y:auto;width:min(400px,90vw);
    padding:4px 16px;background:rgba(8,19,27,.66);border:1px solid rgba(255,255,255,.08)}
  /* bos liste durumu: kabin ortasinda dursun */
  .hsList .lede{margin:10px 0;max-width:none;text-align:center}
  .hsRow{display:flex;align-items:center;gap:12px;padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.07);font-variant-numeric:tabular-nums}
  .hsRank{width:24px;color:var(--muted);font-weight:700;font-size:13.5px}
  .hsName{flex:1;font-weight:700;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hsScore{color:var(--oxygen);font-weight:700}
  .cta{padding:15px 32px 14px;font-size:14px;font-weight:700;letter-spacing:.1em;color:#04191c;
    background:linear-gradient(100deg,var(--oxygen),#7bf0e6);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
    transition:filter .15s,transform .1s}
  .cta:hover{filter:brightness(1.12)}
  .cta:active{transform:translateY(1px)}
  .ghost{padding:14px 18px 13px;font-size:13.5px;letter-spacing:.05em;color:var(--label);font-weight:700}
  .ghost:hover{color:var(--bone)}
  button:focus-visible{outline:2px solid var(--cyclamen);outline-offset:3px}

  /* ---------- GOAL-020: ses ayarları ----------
     Müzik ve efektler ayrı kaydırıcılar. Dokunmatikte rahat tutulsun diye
     iz yüksek, tutamak büyük; oyunun HUD diliyle aynı köşeli/turkuaz görünüm. */
  .volList{display:flex;flex-direction:column;gap:20px;width:min(360px,88vw);margin:6px auto 26px}
  .volRow{display:flex;flex-direction:column;gap:9px}
  .volHead{display:flex;align-items:baseline;justify-content:space-between}
  .volHead span{font-size:12.5px;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .volHead b{font-size:15px;font-weight:700;color:var(--oxygen);font-variant-numeric:tabular-nums;
    text-shadow:0 0 12px rgba(53,224,216,.45)}
  .volSlider{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:none;
    outline:none;cursor:pointer;touch-action:pan-y}
  .volSlider::-webkit-slider-runnable-track{height:6px;background:rgba(6,16,23,.8);
    border:1px solid rgba(53,224,216,.26)}
  .volSlider::-moz-range-track{height:6px;background:rgba(6,16,23,.8);
    border:1px solid rgba(53,224,216,.26)}
  .volSlider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:24px;
    margin-top:-10px;background:linear-gradient(160deg,var(--oxygen),#7bf0e6);border:0;
    box-shadow:0 0 14px rgba(53,224,216,.6);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
  .volSlider::-moz-range-thumb{width:18px;height:24px;border:0;
    background:linear-gradient(160deg,var(--oxygen),#7bf0e6);box-shadow:0 0 14px rgba(53,224,216,.6);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
  .volSlider:focus-visible::-webkit-slider-thumb{outline:2px solid var(--cyclamen);outline-offset:2px}
  /* GOAL-022: panel icinde 88vw, plaketin ic genisliginden buyuk kalip dugmeleri
     cercevenin disina tasiriyordu; burada kabin kendi genisligine uyuyorlar. */
  .plate .volList{margin-left:0;width:100%;max-width:360px}
  .plate .menuStack{width:100%;max-width:360px}
  /* ---------- kontroller ---------- */
  #pad{position:absolute;inset:0;z-index:4;touch-action:none}
  #ring,#knob{position:absolute;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .12s}
  #ring{width:116px;height:116px;margin:-58px 0 0 -58px;border:1px solid rgba(53,224,216,.35);
    background:radial-gradient(circle,rgba(53,224,216,.07),transparent 68%)}
  #knob{width:40px;height:40px;margin:-20px 0 0 -20px;background:rgba(53,224,216,.42);
    box-shadow:0 0 26px rgba(53,224,216,.55)}
  #ring.on,#knob.on{opacity:1}
  /* GOAL-021: dokunmatikte 42x38 hedef küçüktü; 58x50'ye çıktı ve yazısı okunur oldu */
  #tools{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;display:flex;gap:10px}
  .tool{min-width:58px;height:50px;padding:0 12px;font-size:12.5px;letter-spacing:.04em;font-weight:700;
    color:var(--label);border:1px solid rgba(255,255,255,.18);background:rgba(8,17,25,.85);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
  .tool:hover{color:var(--bone);border-color:rgba(53,224,216,.45);background:rgba(12,28,36,.9)}
  .tool:active{transform:translateY(1px)}
  /* GOAL-022: dokunmatikte sahanın altında kalan bant baş parmağın yeri.
     İlk sürüklemeye kadar orada kontrol ipucu duruyor — hem bandı boş
     bırakmıyor hem de telefonda oyunu nasıl oynayacağını söylüyor.
     Dikey konumu JS'ten geliyor (bkz. layout), çünkü sahanın nerede bittiği
     ekrana göre değişiyor. */
  #touchHint{position:absolute;left:14px;right:14px;z-index:4;pointer-events:none;
    text-align:center;opacity:0;transition:opacity .4s;display:none}
  #touchHint.on{display:block;opacity:1}
  #touchHint b{display:inline-block;font-size:13.5px;font-weight:700;letter-spacing:.02em;
    color:var(--label);padding:11px 18px 10px;border:1px solid rgba(53,224,216,.3);
    background:rgba(8,20,28,.72);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}
  #touchHint i{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:9px}
  #fps{position:absolute;left:16px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;
    font-size:11.5px;letter-spacing:.03em;color:var(--muted);display:none;font-variant-numeric:tabular-nums}
  #fps.on{display:block}
  #boot{position:absolute;inset:0;z-index:9;display:grid;place-items:center;
    font-size:13px;letter-spacing:.1em;color:var(--oxygen)}
  /* GOAL-022: telefonda panel ve menü ölçüleri — dört düğmeli duraklatma
     menüsü 360x780'lik bir ekrana rahat sığsın diye. */
  @media (max-width:680px){
    #overlay{padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
    .plate{padding:20px 18px 18px}
    .kicker{margin-bottom:10px}
    .title{font-size:clamp(23px,6.6vw,34px);margin-bottom:12px}
    .lede{font-size:14.5px;line-height:1.66;margin-bottom:14px}
    .note{margin-bottom:14px}
    .rule{margin:14px 0}
    .stats{gap:20px;margin-bottom:16px}
    .stats div b{font-size:25px}
    .menuStack{gap:10px}
    .menuBtn{padding:15px 18px;font-size:15px}
    .menuBtn.primary{padding:17px 18px;font-size:16px}
    .menuBtn.ghost{padding:13px 16px;font-size:13.5px}
    .menuBack{margin-top:16px}
    .plateShot{gap:12px;margin-bottom:14px}
    .plateShot img{width:116px;height:94px}
    .plateShot p{font-size:13.5px}
    .volList{gap:15px;margin-bottom:18px}
    .menuBrand{margin-bottom:26px}
    /* Telefonda buzlu cam pahalı bir efekt; yarıçapı düşürüyoruz. */
    #menuScreen{padding:24px 14px calc(24px + env(safe-area-inset-bottom));
      -webkit-backdrop-filter:blur(14px) saturate(1.15);
      backdrop-filter:blur(14px) saturate(1.15)}
    .menuHero{margin-bottom:24px}
    .heroBreath{top:40px;width:320px;height:320px;margin:-160px 0 0 -160px}
    .heroEmblem{width:80px;height:80px;margin-bottom:14px;
      clip-path:polygon(0 14px,14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
    .heroEmblem::after{clip-path:polygon(0 13px,13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%)}
    .heroEmblem img{width:56px;height:59px}
    .wordmark{letter-spacing:.05em}
    .heroSub{margin-top:11px}
    .heroSub span{font-size:11px;letter-spacing:.11em;margin-right:-.11em}
    .heroTag{margin-top:14px}
    .heroRule{margin-top:20px}
    .menuBtn.nav{gap:10px;padding-left:18px}
    .mbHint{font-size:11px;letter-spacing:.03em}
    .menuFoot{margin-top:18px;gap:10px;font-size:11px;letter-spacing:.04em}
    .levelGrid{max-height:46vh;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
    .hsList{max-height:44vh}
    #toast .t{font-size:24px}
    #toast .s{font-size:12.5px;margin-top:6px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="boot">YÜKLENİYOR</div>
  <div id="vig"></div>
  <div id="pressVeil"></div>
  <div id="flowVeil"></div>
  <div id="hud">
    <div class="hudInner" id="hudInner">
      <div class="row">
        <div id="day"><div class="lbl">GÜN</div><div class="num">01</div></div>
        <div id="stage">
          <div id="stageName">Akut tıkanıklık</div>
          <div class="gauge"><span id="gaugeFill"></span><i id="gaugeGoal"></i></div>
          <div id="pctRead"><b>%0</b> temizlendi <span class="tag">hedef %70</span></div>
        </div>
        <div id="scoreBox"><div class="lbl">SKOR</div><div class="num" id="scoreVal">0</div></div>
      </div>

      <div id="sub">
        <div class="meter" id="livesWrap">
          <div class="mHead"><span class="lbl">CAN</span></div>
          <div id="lives"></div>
        </div>
        <div class="meter" id="doseWrap">
          <div class="mHead"><span class="lbl">DOZ KALKANI</span><b id="doseVal">%100</b></div>
          <div class="bar" id="dose"><span id="doseFill"></span></div>
        </div>
        <div class="meter" id="pressWrap">
          <div class="mHead"><span class="lbl">BASINÇ</span><b id="pressVal">%0</b></div>
          <div class="bar" id="press"><span id="pressFill"></span></div>
        </div>
        <div class="meter" id="airway">
          <div class="mHead"><span class="lbl">HAVA AKIŞI</span><b id="airPct">%0</b></div>
          <div class="bar" id="airGauge"><u id="airFill"></u><em id="airMark"></em></div>
          <div class="mSub"><span>NEFES</span><i class="bar thin"><u id="breathBar"></u></i><b id="breathVal">–8s</b></div>
        </div>
      </div>

      <div id="buffs"></div>
    </div>
  </div>

  <div id="toast"><div class="t"></div><div class="s"></div></div>
  <div id="pad"><div id="ring"></div><div id="knob"></div></div>
  <div id="tools">
    <button class="tool" id="btnSound" aria-label="Sesi aç veya kapat">SES</button>
    <button class="tool" id="btnPause" aria-label="Duraklat">DUR</button>
  </div>
  <div id="touchHint"><b>Parmağını sürükleyerek yönlendir</b>
    <i>Dokudan bir parça kes, kapattığın alan temizlenir.</i></div>
  <div id="fps"></div>
  <div id="overlay"><div class="plateEdge"><div class="plate" id="plate"></div></div></div>
  <div id="menuScreen"><div id="menuContent"></div></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
